services:
  mysql:
    image: mysql:latest
    container_name: mysql-idempotency-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root@123
      MYSQL_DATABASE: idempotency
      MYSQL_USER: appuser
      MYSQL_PASSWORD: 123456

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data: